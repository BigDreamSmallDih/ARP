name: Provider integration tests

# Manual only. These tests call the real provider APIs with secrets, so they never run on pull
# requests or pushes. Store the secrets as environment secrets of the "live-providers" environment
# and add yourself as a required reviewer there, so every run waits for your approval.
#
# Each provider is tested on its own and only when both its API key and its model secret reach the
# run. Anything else is reported as NOT TESTED. The billable call needs "paid_calls" ticked.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to test
        type: choice
        options: [all, openai, anthropic, gemini]
        default: all
      paid_calls:
        description: Also send one small message to each selected provider (billable)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live:
    name: Live provider checks
    runs-on: ubuntu-latest
    environment: live-providers
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No secrets are in the environment while dependencies install.
      - name: Set up the project
        uses: ./.github/actions/setup

      # Only the selected provider's secrets are passed, and only to this step.
      - name: Run integration tests
        env:
          OPENAI_API_KEY: ${{ (inputs.provider == 'all' || inputs.provider == 'openai') && secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: ${{ (inputs.provider == 'all' || inputs.provider == 'openai') && secrets.OPENAI_MODEL || '' }}
          ANTHROPIC_API_KEY: ${{ (inputs.provider == 'all' || inputs.provider == 'anthropic') && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_MODEL: ${{ (inputs.provider == 'all' || inputs.provider == 'anthropic') && secrets.ANTHROPIC_MODEL || '' }}
          GEMINI_API_KEY: ${{ (inputs.provider == 'all' || inputs.provider == 'gemini') && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ (inputs.provider == 'all' || inputs.provider == 'gemini') && secrets.GEMINI_MODEL || '' }}
          ARP_INTEGRATION_PAID_CALLS: ${{ inputs.paid_calls }}
        run: |
          mkdir -p reports
          npm run test:integration -- --reporter=default --reporter=json --outputFile.json=reports/integration.json

      - name: Summarise per provider
        if: always()
        run: node scripts/integration-summary.mjs reports/integration.json | tee -a "$GITHUB_STEP_SUMMARY"
