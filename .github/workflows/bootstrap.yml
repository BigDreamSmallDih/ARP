name: Bootstrap lockfile

# Generates package-lock.json on a GitHub runner, checks it, and runs every check
# against it. Run this once, review the lockfile artifact, then commit it. The regular
# CI workflow installs with `npm ci` from that committed file.

on:
  workflow_dispatch:
    inputs:
      regenerate:
        description: Delete the existing package-lock.json and resolve dependencies again
        type: boolean
        default: false
      commit_lockfile:
        description: Commit package-lock.json to the selected branch when every check passes
        type: boolean
        default: false

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse to overwrite an existing lockfile
        if: ${{ !inputs.regenerate }}
        run: |
          if [ -f package-lock.json ]; then
            echo "::error::package-lock.json already exists. Use the CI workflow, or rerun with regenerate enabled."
            exit 1
          fi

      - name: Resolve dependencies and write package-lock.json
        run: |
          mkdir -p reports
          rm -f package-lock.json
          npm install --no-audit --no-fund 2>&1 | tee reports/install.log

      - name: Inspect the lockfile
        run: node scripts/verify-lockfile.mjs 2>&1 | tee reports/lockfile.log

      - name: Reinstall from the lockfile with npm ci
        run: |
          rm -rf node_modules
          npm ci --no-audit --no-fund 2>&1 | tee reports/ci-install.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee reports/lint.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee reports/typecheck.log

      - name: Unit tests
        id: test
        continue-on-error: true
        run: npm run test:ci 2>&1 | tee reports/test.log

      - name: Build gateway
        id: build_gateway
        continue-on-error: true
        run: npm run build:gateway 2>&1 | tee reports/build-gateway.log

      - name: Build dashboard
        id: build_dashboard
        continue-on-error: true
        run: npm run build:dashboard 2>&1 | tee reports/build-dashboard.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-reports
          path: reports/
          if-no-files-found: ignore

      - name: Upload lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD_GATEWAY: ${{ steps.build_gateway.outcome }}
          BUILD_DASHBOARD: ${{ steps.build_dashboard.outcome }}
        run: |
          {
            echo "## Bootstrap results"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Lint | $LINT |"
            echo "| Typecheck | $TYPECHECK |"
            echo "| Unit tests | $TEST |"
            echo "| Gateway build | $BUILD_GATEWAY |"
            echo "| Dashboard build | $BUILD_DASHBOARD |"
            echo
            echo "Logs and the lockfile are attached to this run as artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a check failed
        if: ${{ steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build_gateway.outcome == 'failure' || steps.build_dashboard.outcome == 'failure' }}
        run: |
          echo "::error::At least one check failed. Read the logs in the bootstrap-reports artifact."
          exit 1

      - name: Commit the lockfile
        if: ${{ inputs.commit_lockfile && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.test.outcome == 'success' && steps.build_gateway.outcome == 'success' && steps.build_dashboard.outcome == 'success' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is unchanged; nothing to commit."
          else
            git commit -m "chore: add package-lock.json from bootstrap run"
            git push origin "HEAD:${BRANCH}"
          fi
